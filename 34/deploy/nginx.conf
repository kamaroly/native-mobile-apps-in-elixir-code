# deploy/nginx.conf: /etc/nginx/sites-available/risiti
upstream risiti {
  server 127.0.0.1:4000;
  server 127.0.0.1:4001;
  server 127.0.0.1:4002;
}

server {
  server_name risiti.example.com;

  # The phone uploads receipts of up to 10 MB.
  client_max_body_size 12m;

  location / {
    proxy_pass http://risiti;
    # A port that's restarting refuses the connection: try the next one.
    proxy_next_upstream error timeout http_502;

    # LiveView's WebSocket.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    # The caller's address, for the SMS code limits (RisitiWeb.ClientAddress).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
